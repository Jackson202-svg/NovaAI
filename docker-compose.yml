version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: novaai
      POSTGRES_USER: novaai
      POSTGRES_PASSWORD: novaai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/var/lib/mongodb/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  api:
    build:
      context: ./backend/api
    ports:
      - "4000:4000"
    env_file:
      - .env
    depends_on:
      - postgres
      - mongo
      - redis

volumes:
  postgres-data:
  mongo-data:
  redis-data:
